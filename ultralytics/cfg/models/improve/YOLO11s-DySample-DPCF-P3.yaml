# YOLO11s + DySample + DPCF-P3

nc: 1
scale: s

scales:
  s: [0.50, 0.50, 1024]

# ================= Backbone =================
backbone:
  - [-1, 1, Conv, [64, 3, 2]]                  # 0
  - [-1, 1, Conv, [128, 3, 2]]                 # 1
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2 P2
  - [-1, 1, Conv, [256, 3, 2]]                 # 3
  - [-1, 2, C3k2, [512, False, 0.25]]          # 4 P3
  - [-1, 1, Conv, [512, 3, 2]]                 # 5
  - [-1, 2, C3k2, [512, True]]                 # 6 P4
  - [-1, 1, Conv, [1024, 3, 2]]                # 7
  - [-1, 2, C3k2, [1024, True]]                # 8
  - [-1, 1, SPPF, [1024, 5]]                   # 9
  - [-1, 2, C2PSA, [1024]]                     # 10

# ================= Neck / Head =================
head:

  # P5 -> P4
  - [-1, 1, DySample, []]                      # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12
  - [-1, 2, C3k2, [512, False]]                # 13

  # P4 -> P3
  - [-1, 1, DySample, []]                      # 14

  # P2 + Backbone P3 -> DPCF
  - [[2, 4], 1, DPCF, [512]]                   # 15

  # DPCF + DySample feature fusion
  - [[14, 15], 1, Concat, [1]]                 # 16
  - [-1, 2, C3k2, [256, False]]                # 17 P3

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                 # 18
  - [[-1, 13], 1, Concat, [1]]                 # 19
  - [-1, 2, C3k2, [512, False]]                # 20 P4

  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                 # 21
  - [[-1, 10], 1, Concat, [1]]                 # 22
  - [-1, 2, C3k2, [1024, True]]                # 23 P5

  # Detect: P3 / P4 / P5
  - [[17, 20, 23], 1, Detect, [nc]]            # 24