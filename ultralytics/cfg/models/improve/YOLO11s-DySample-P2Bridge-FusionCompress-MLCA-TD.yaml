
nc: 1
scale: s

scales:
  s: [0.50, 0.50, 1024]

# ================= Backbone =================
backbone:
  - [-1, 1, Conv, [64, 3, 2]]                  # 0
  - [-1, 1, Conv, [128, 3, 2]]                 # 1
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2 P2
  - [-1, 1, Conv, [256, 3, 2]]                 # 3
  - [-1, 2, C3k2, [512, False, 0.25]]          # 4 P3
  - [-1, 1, Conv, [512, 3, 2]]                 # 5
  - [-1, 2, C3k2, [512, True]]                 # 6 P4
  - [-1, 1, Conv, [1024, 3, 2]]                # 7
  - [-1, 2, C3k2, [1024, True]]                # 8
  - [-1, 1, SPPF, [1024, 5]]                   # 9
  - [-1, 2, C2PSA, [1024]]                     # 10 P5

# ================= Neck =================
head:

  # P5 -> P4
  - [-1, 1, DySample, []]                      # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12
  - [-1, 1, MLCA, []]                          # 13
  - [-1, 2, C3k2, [512, False]]                # 14 P4

  # P4 -> P3
  - [-1, 1, DySample, []]                      # 15

  # P2 Bridge: Direct Downsampling
  - [2, 1, Conv, [64, 3, 2]]                   # 16

  # P3 Three-way Fusion
  - [[15, 4, 16], 1, Concat, [1]]              # 17: 544 channels

  # Fusion Compression
  - [-1, 1, Conv, [512, 1, 1]]                 # 18: 256 actual channels

  # Attention
  - [-1, 1, MLCA, []]                          # 19

  # P3 Feature Refinement
  - [-1, 2, C3k2, [256, False]]                # 20 P3

  # Bottom-up P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                 # 21
  - [[-1, 14], 1, Concat, [1]]                 # 22
  - [-1, 2, C3k2, [512, False]]                # 23 P4

  # Bottom-up P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                 # 24
  - [[-1, 10], 1, Concat, [1]]                 # 25
  - [-1, 2, C3k2, [1024, True]]                # 26 P5

  # Detect
  - [[20, 23, 26], 1, Detect, [nc]]            # 27
