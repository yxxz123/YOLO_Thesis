# DCNv2-P3: replace only backbone layer 4 of the three-module baseline.
# scale s: input=128, output=256, hidden=64, effective internal repeats=1.
# Requires the project C3k2_Block/DCNv2 parser support and torchvision deform_conv2d.

# YOLO11s + DySample + P2Bridge + MLCA-TD

nc: 1
scale: s

scales:
  s: [0.50, 0.50, 1024]

# ================= Backbone =================
backbone:
  - [-1, 1, Conv, [64, 3, 2]]                  # 0
  - [-1, 1, Conv, [128, 3, 2]]                 # 1
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2 P2
  - [-1, 1, Conv, [256, 3, 2]]                 # 3
  - [-1, 2, C3k2_Block, [512, {module: DCNv2, param: {kernel_size: 3, stride: 1, groups: 1, deformable_groups: 1}}, False, 0.25]] # 4 P3
  - [-1, 1, Conv, [512, 3, 2]]                 # 5
  - [-1, 2, C3k2, [512, True]]                 # 6 P4
  - [-1, 1, Conv, [1024, 3, 2]]                # 7
  - [-1, 2, C3k2, [1024, True]]                # 8
  - [-1, 1, SPPF, [1024, 5]]                   # 9
  - [-1, 2, C2PSA, [1024]]                     # 10 P5

# ================= Neck =================
head:
  # P5 -> P4
  - [-1, 1, DySample, []]                      # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12
  - [-1, 1, MLCA, []]                          # 13
  - [-1, 2, C3k2, [512, False]]                # 14

  # P4 -> P3
  - [-1, 1, DySample, []]                      # 15

  # P2 Bridge
  - [2, 1, Conv, [64, 3, 2]]                   # 16

  # P3 three-way fusion
  - [[15, 4, 16], 1, Concat, [1]]              # 17
  - [-1, 1, MLCA, []]                          # 18
  - [-1, 2, C3k2, [256, False]]                # 19

  # PAN P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                 # 20
  - [[-1, 14], 1, Concat, [1]]                 # 21
  - [-1, 2, C3k2, [512, False]]                # 22

  # PAN P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                 # 23
  - [[-1, 10], 1, Concat, [1]]                 # 24
  - [-1, 2, C3k2, [1024, True]]                # 25

  # Detect
  - [[19, 22, 25], 1, Detect, [nc]]            # 26