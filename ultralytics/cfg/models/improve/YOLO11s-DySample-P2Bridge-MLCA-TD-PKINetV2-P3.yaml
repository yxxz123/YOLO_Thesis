# YOLO11s + DySample + P2Bridge + MLCA-TD + PKINetV2Block
# Experimental module is inserted after the backbone P3 feature (layer 4).
# scale=s applies width_multiple=0.50, so module args use base channels 512 -> actual 256.

nc: 1
scale: s

scales:
  s: [0.50, 0.50, 1024]

# ================= Backbone =================
backbone:
  - [-1, 1, Conv, [64, 3, 2]]                  # 0
  - [-1, 1, Conv, [128, 3, 2]]                 # 1
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2 P2
  - [-1, 1, Conv, [256, 3, 2]]                 # 3
  - [-1, 2, C3k2, [512, False, 0.25]]          # 4 P3
  - [-1, 1, PKINetV2Block, [512, 2.0, 0.0, 0.0]]                           # 5 P3 enhancement
  - [-1, 1, Conv, [512, 3, 2]]                 # 6
  - [-1, 2, C3k2, [512, True]]                 # 7 P4
  - [-1, 1, Conv, [1024, 3, 2]]                # 8
  - [-1, 2, C3k2, [1024, True]]                # 9
  - [-1, 1, SPPF, [1024, 5]]                   # 10
  - [-1, 2, C2PSA, [1024]]                     # 11 P5

# ================= Neck =================
head:
  # P5 -> P4
  - [-1, 1, DySample, []]                      # 12
  - [[-1, 7], 1, Concat, [1]]                  # 13
  - [-1, 1, MLCA, []]                          # 14
  - [-1, 2, C3k2, [512, False]]                # 15 P4

  # P4 -> P3
  - [-1, 1, DySample, []]                      # 16

  # P2 Bridge
  - [2, 1, Conv, [64, 3, 2]]                   # 17

  # P3 three-way fusion
  - [[16, 5, 17], 1, Concat, [1]]              # 18
  - [-1, 1, MLCA, []]                          # 19
  - [-1, 2, C3k2, [256, False]]                # 20 P3

  # PAN P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                 # 21
  - [[-1, 15], 1, Concat, [1]]                 # 22
  - [-1, 2, C3k2, [512, False]]                # 23 P4

  # PAN P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                 # 24
  - [[-1, 11], 1, Concat, [1]]                 # 25
  - [-1, 2, C3k2, [1024, True]]                # 26 P5

  # Detect
  - [[20, 23, 26], 1, Detect, [nc]]            # 27 P3/P4/P5
