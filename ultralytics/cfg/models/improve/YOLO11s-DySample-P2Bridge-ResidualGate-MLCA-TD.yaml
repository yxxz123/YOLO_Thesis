
# ============================================================
# YOLO11s + DySample + P2Bridge + ResidualGate + MLCA-TD
#
# Core:
# 1. Keep original YOLO11s backbone.
# 2. Keep DySample P5 -> P4 and P4 -> P3.
# 3. Preserve P2 shallow detail through an independent branch.
# 4. Inject P2 into P3 using learnable channel-wise residual gates.
# 5. Keep MLCA at P4 and P3.
# 6. Keep P3/P4/P5 detection heads.
# 7. No P2 detection head.
# ============================================================

nc: 1
scale: s

scales:
  s: [0.50, 0.50, 1024]


# ================= Backbone =================

backbone:

  - [-1, 1, Conv, [64, 3, 2]]                  # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]                 # 1 P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2 P2

  - [-1, 1, Conv, [256, 3, 2]]                 # 3 P3
  - [-1, 2, C3k2, [512, False, 0.25]]          # 4 P3

  - [-1, 1, Conv, [512, 3, 2]]                 # 5 P4
  - [-1, 2, C3k2, [512, True]]                 # 6 P4

  - [-1, 1, Conv, [1024, 3, 2]]                # 7 P5
  - [-1, 2, C3k2, [1024, True]]                # 8 P5

  - [-1, 1, SPPF, [1024, 5]]                   # 9
  - [-1, 2, C2PSA, [1024]]                     # 10 P5


# ================= Neck =================

head:

  # ----------------------------------------------------------
  # P5 -> P4
  # 保留原始DySample + MLCA-TD结构
  # ----------------------------------------------------------

  - [-1, 1, DySample, []]                      # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12
  - [-1, 1, MLCA, []]                          # 13
  - [-1, 2, C3k2, [512, False]]                # 14 P4


  # ----------------------------------------------------------
  # P4 -> P3
  # ----------------------------------------------------------

  - [-1, 1, DySample, []]                      # 15


  # ----------------------------------------------------------
  # P2 Bridge
  # P2 -> P3
  # 独立提取浅层细节
  # ----------------------------------------------------------

  - [2, 1, Conv, [64, 3, 2]]                   # 16 P2 Bridge


  # ----------------------------------------------------------
  # P3 Main Feature
  # 只融合DySample P3和Backbone P3
  # ----------------------------------------------------------

  - [[15, 4], 1, Concat, [1]]                 # 17 P3 Main


  # ----------------------------------------------------------
  # P2 Residual Gated Fusion
  #
  # Inputs:
  # 17: P3 Main Feature
  # 16: P2 Bridge Feature
  #
  # P2独立投影后，通过可学习门控注入P3
  # ----------------------------------------------------------

  - [[17, 16], 1, P2ResidualGate, [0.1]]       # 18


  # ----------------------------------------------------------
  # P3 Attention + Feature Refinement
  # ----------------------------------------------------------

  - [-1, 1, MLCA, []]                          # 19
  - [-1, 2, C3k2, [256, False]]                # 20 P3


  # ----------------------------------------------------------
  # PAN P3 -> P4
  # ----------------------------------------------------------

  - [-1, 1, Conv, [256, 3, 2]]                 # 21
  - [[-1, 14], 1, Concat, [1]]                 # 22
  - [-1, 2, C3k2, [512, False]]                # 23 P4


  # ----------------------------------------------------------
  # PAN P4 -> P5
  # ----------------------------------------------------------

  - [-1, 1, Conv, [512, 3, 2]]                 # 24
  - [[-1, 10], 1, Concat, [1]]                 # 25
  - [-1, 2, C3k2, [1024, True]]                # 26 P5


  # ----------------------------------------------------------
  # Detect
  # ----------------------------------------------------------

  - [[20, 23, 26], 1, Detect, [nc]]            # 27
