# =========================================================
# YOLO11s + DySample + P2Bridge-Wide + MLCA-TD
#
# Experiment:
# Increase P2Bridge output channels from 32 to 64
# Actual channels after width scaling:
# Original: 64 * 0.5 = 32
# Current:  128 * 0.5 = 64
#
# Purpose:
# Improve shallow P2 feature information transmission
# and small-object detection performance.
#
# No P2 detection head.
# No additional attention modules.
# No automatic screening.
# =========================================================

nc: 1
scale: s

scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]


# =========================================================
# Backbone
# =========================================================

backbone:

  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2

  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2-P2/4

  - [-1, 1, Conv, [256, 3, 2]]                 # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]          # 4-P3/8

  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                 # 6-P4/16

  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]                # 8-P5/32

  - [-1, 1, SPPF, [1024, 5]]                   # 9-P5/32
  - [-1, 2, C2PSA, [1024]]                     # 10-P5/32


# =========================================================
# Neck / Head
# =========================================================

head:

  # -------------------------------------------------------
  # P5 -> P4
  # DySample upsampling
  # -------------------------------------------------------

  - [-1, 1, DySample, []]                      # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12
  - [-1, 1, MLCA, []]                          # 13
  - [-1, 2, C3k2, [512, False]]                # 14-P4/16


  # -------------------------------------------------------
  # P4 -> P3
  # DySample upsampling
  # -------------------------------------------------------

  - [-1, 1, DySample, []]                      # 15-P3/8


  # -------------------------------------------------------
  # P2 Bridge
  # Wider channel projection
  #
  # Original: [64, 3, 2]
  # Current:  [128, 3, 2]
  #
  # Actual output channels:
  # Original = 32
  # Current  = 64
  # -------------------------------------------------------

  - [2, 1, Conv, [128, 3, 2]]                  # 16-P3/8


  # -------------------------------------------------------
  # P3 three-way feature fusion
  #
  # DySample P3
  # Backbone P3
  # P2 Bridge P3
  # -------------------------------------------------------

  - [[15, 4, 16], 1, Concat, [1]]              # 17

  - [-1, 1, MLCA, []]                          # 18

  - [-1, 2, C3k2, [256, False]]                # 19-P3/8


  # -------------------------------------------------------
  # Bottom-up P3 -> P4
  # -------------------------------------------------------

  - [-1, 1, Conv, [256, 3, 2]]                 # 20

  - [[-1, 14], 1, Concat, [1]]                # 21

  - [-1, 2, C3k2, [512, False]]                # 22-P4/16


  # -------------------------------------------------------
  # Bottom-up P4 -> P5
  # -------------------------------------------------------

  - [-1, 1, Conv, [512, 3, 2]]                 # 23

  - [[-1, 10], 1, Concat, [1]]                # 24

  - [-1, 2, C3k2, [1024, True]]                # 25-P5/32


  # -------------------------------------------------------
  # Detect
  # P3 / P4 / P5
  # -------------------------------------------------------

  - [[19, 22, 25], 1, Detect, [nc]]            # 26