# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

nc: 1
scale: s

scales:
  s: [0.50, 0.50, 1024]

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11-P4/16
  - [[-1, 6], 1, Concat, [1]] # 12-P4/16
  - [-1, 1, MLCA, []] # 13-P4/16
  - [-1, 2, C3k2, [512, False]] # 14-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15-P3/8
  - [[-1, 4], 1, Concat, [1]] # 16-P3/8
  - [-1, 1, MLCA, []] # 17-P3/8
  - [-1, 2, C3k2, [256, False]] # 18-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 19-P4/16
  - [[-1, 14], 1, Concat, [1]] # 20-P4/16
  - [-1, 1, MLCA, []] # 21-P4/16
  - [-1, 2, C3k2, [512, False]] # 22-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 23-P5/32
  - [[-1, 10], 1, Concat, [1]] # 24-P5/32
  - [-1, 1, MLCA, []] # 25-P5/32
  - [-1, 2, C3k2, [1024, True]] # 26-P5/32

  - [[18, 22, 26], 1, Detect, [nc]] # 27-P3/8,P4/16,P5/32
