# Ultralytics YOLO11 LightP2 neck model
# Keeps the YOLO11 backbone and adds a lightweight P2/4 detection branch.
# Intended for tiny/small vehicle detection in HighwayVehicle_v1.
# Parameters
nc: 1
scale: s
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11 backbone. Indices 2, 4, 6 and 10 are P2, P3, P4 and P5.
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32

# Lightweight four-scale PAN neck.
# The lateral channels are reduced before fusion so the P2 branch does not
# replicate the high-channel HFP/SDP path used by the full HS-FPN model.
head:
  - [10, 1, Conv, [256, 1, 1]] # 11-P5/32 lateral
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12-P4/16
  - [6, 1, Conv, [256, 1, 1]] # 13-P4/16 lateral
  - [[-1, 13], 1, Concat, [1]] # 14-P4/16
  - [-1, 1, C3k2, [256, False, 0.25]] # 15-P4/16

  - [-1, 1, Conv, [128, 1, 1]] # 16-P4/16 lateral
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17-P3/8
  - [4, 1, Conv, [128, 1, 1]] # 18-P3/8 lateral
  - [[-1, 18], 1, Concat, [1]] # 19-P3/8
  - [-1, 1, C3k2, [128, False, 0.25]] # 20-P3/8

  - [-1, 1, Conv, [64, 1, 1]] # 21-P3/8 lateral
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 22-P2/4
  - [2, 1, Conv, [64, 1, 1]] # 23-P2/4 lateral
  - [[-1, 23], 1, Concat, [1]] # 24-P2/4
  - [-1, 1, C3k2, [64, False, 0.25]] # 25-P2/4

  # Lightweight bottom-up path restores the PAN aggregation at P3-P5.
  - [-1, 1, Conv, [128, 3, 2]] # 26-P3/8
  - [[-1, 20], 1, Concat, [1]] # 27-P3/8
  - [-1, 1, C3k2, [128, False, 0.25]] # 28-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 29-P4/16
  - [[-1, 15], 1, Concat, [1]] # 30-P4/16
  - [-1, 1, C3k2, [256, False, 0.25]] # 31-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 32-P5/32
  - [[-1, 11], 1, Concat, [1]] # 33-P5/32
  - [-1, 1, C3k2, [512, True]] # 34-P5/32

  - [[25, 28, 31, 34], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
