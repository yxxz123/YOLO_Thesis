# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, repvit_m0_9, [False]] # 0-P2/4,P3/8,P4/16,P5/32
  - [0, 1, GetIndexOutput, [1]] # 1-P3/8
  - [0, 1, GetIndexOutput, [2]] # 2-P4/16
  - [0, 1, GetIndexOutput, [3]] # 3-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 4-P5/32
  - [-1, 2, C2PSA, [1024]] # 5-P5/32

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 6-P4/16
  - [[-1, 2], 1, Concat, [1]] # 7-P4/16
  - [-1, 2, C3k2, [512, False]] # 8-P4/16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9-P3/8
  - [[-1, 1], 1, Concat, [1]] # 10-P3/8
  - [-1, 2, C3k2, [256, False]] # 11-P3/8
  - [-1, 1, Conv, [256, 3, 2]] # 12-P4/16
  - [[-1, 8], 1, Concat, [1]] # 13-P4/16
  - [-1, 2, C3k2, [512, False]] # 14-P4/16
  - [-1, 1, Conv, [512, 3, 2]] # 15-P5/32
  - [[-1, 5], 1, Concat, [1]] # 16-P5/32
  - [-1, 2, C3k2, [1024, True]] # 17-P5/32
  - [[11, 14, 17], 1, Detect, [nc]] # 18-P3/8,P4/16,P5/32
