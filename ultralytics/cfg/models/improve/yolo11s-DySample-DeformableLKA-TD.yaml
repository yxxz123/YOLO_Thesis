# Ultralytics YOLO11s
# DySample + DeformableLKA-TD
#
# Design:
# 1. Keep YOLO11s backbone unchanged.
# 2. Keep DySample as the upsampling operator.
# 3. Insert DeformableLKA after the two top-down Concat nodes.
# 4. Do not modify the bottom-up PAN path.
#
# Goal:
# Improve spatial alignment and contextual modeling after
# DySample features are fused with backbone lateral features.

nc: 1

scale: s

scales:
  s: [0.50, 0.50, 1024]


# ============================================================
# Backbone
# ============================================================

backbone:

  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2

  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2-P2/4

  - [-1, 1, Conv, [256, 3, 2]]                 # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]          # 4-P3/8

  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                 # 6-P4/16

  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]                # 8-P5/32

  - [-1, 1, SPPF, [1024, 5]]                   # 9-P5/32
  - [-1, 2, C2PSA, [1024]]                     # 10-P5/32


# ============================================================
# Head
# ============================================================

head:

  # ----------------------------------------------------------
  # Top-down: P5 -> P4
  # DySample + lateral fusion + DeformableLKA
  # ----------------------------------------------------------

  - [-1, 1, DySample, []]                      # 11-P4/16

  - [[-1, 6], 1, Concat, [1]]                  # 12-P4/16

  - [-1, 1, DeformableLKA, []]                 # 13-P4/16

  - [-1, 2, C3k2, [512, False]]                # 14-P4/16


  # ----------------------------------------------------------
  # Top-down: P4 -> P3
  # DySample + lateral fusion + DeformableLKA
  # ----------------------------------------------------------

  - [-1, 1, DySample, []]                      # 15-P3/8

  - [[-1, 4], 1, Concat, [1]]                  # 16-P3/8

  - [-1, 1, DeformableLKA, []]                 # 17-P3/8

  - [-1, 2, C3k2, [256, False]]                # 18-P3/8


  # ----------------------------------------------------------
  # Bottom-up PAN: unchanged
  # ----------------------------------------------------------

  - [-1, 1, Conv, [256, 3, 2]]                 # 19-P4/16

  - [[-1, 14], 1, Concat, [1]]                 # 20-P4/16

  - [-1, 2, C3k2, [512, False]]                # 21-P4/16


  - [-1, 1, Conv, [512, 3, 2]]                 # 22-P5/32

  - [[-1, 10], 1, Concat, [1]]                 # 23-P5/32

  - [-1, 2, C3k2, [1024, True]]                # 24-P5/32


  # ----------------------------------------------------------
  # Detect
  # ----------------------------------------------------------

  - [[18, 21, 24], 1, Detect, [nc]]            # 25-P3/8,P4/16,P5/32