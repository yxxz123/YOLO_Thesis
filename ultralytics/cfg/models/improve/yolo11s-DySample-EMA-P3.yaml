
# YOLO11s + DySample + EMA-P3
# Final candidate architecture
#
# DySample: Dynamic feature upsampling
# EMA: P3-only feature refinement
# P4/P5: Preserve original detection branches

nc: 1
scale: s

scales:
  s: [0.50, 0.50, 1024]


# ================= Backbone =================

backbone:

  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]

  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]


# ================= Neck / Head =================

head:

  # Top-down P5 -> P4
  - [-1, 1, DySample, []]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  # Top-down P4 -> P3
  - [-1, 1, DySample, []]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  # Bottom-up P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  # Bottom-up P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  # P3-only EMA refinement
  # Layer 16 output channels = 128
  # EMA factor = 8
  - [16, 1, EMA, []]

  # Three-scale detection
  - [[23, 19, 22], 1, Detect, [nc]]
