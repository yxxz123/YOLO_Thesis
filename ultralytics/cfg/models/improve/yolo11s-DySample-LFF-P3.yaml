
# YOLO11s + DySample + LowFrequencyFeatureFusion-P3
# Dataset: HighwayVehicle-v1.0
# Purpose:
#   DySample: dynamic feature upsampling
#   LowFrequencyFeatureFusion: low-frequency feature enhancement
#   Apply LowFrequencyFeatureFusion only at the P3/8 fusion node
#   Keep the original YOLO11s backbone and standard Detect head

nc: 1

scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

# =========================================================
# Backbone: Original YOLO11s
# =========================================================
backbone:
  # [from, repeats, module, args]

  - [-1, 1, Conv, [64, 3, 2]]             # 0-P1/2

  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2-P2/4

  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4-P3/8

  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6-P4/16

  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8-P5/32

  - [-1, 1, SPPF, [1024, 5]]              # 9-P5/32
  - [-1, 2, C2PSA, [1024]]                # 10-P5/32

# =========================================================
# Neck and Detection Head
# =========================================================
head:

  # -------------------------------------------------------
  # Top-down: P5 -> P4
  # Keep DySample
  # -------------------------------------------------------
  - [-1, 1, DySample, []]                 # 11-P4/16
  - [[-1, 6], 1, Concat, [1]]             # 12-P4/16
  - [-1, 2, C3k2, [512, False]]           # 13-P4/16

  # -------------------------------------------------------
  # Top-down: P4 -> P3
  # Replace the P3 Concat with LowFrequencyFeatureFusion
  # Inputs: layer 14 and backbone layer 4
  # Output channels are scaled by YOLO11s width multiplier
  # -------------------------------------------------------
  - [-1, 1, DySample, []]                 # 14-P3/8
  - [[-1, 4], 1, LowFrequencyFeatureFusion, [256]]  # 15-P3/8
  - [-1, 2, C3k2, [256, False]]           # 16-P3/8

  # -------------------------------------------------------
  # Bottom-up: P3 -> P4
  # Keep the original fusion structure
  # -------------------------------------------------------
  - [-1, 1, Conv, [256, 3, 2]]            # 17-P4/16
  - [[-1, 13], 1, Concat, [1]]            # 18-P4/16
  - [-1, 2, C3k2, [512, False]]           # 19-P4/16

  # -------------------------------------------------------
  # Bottom-up: P4 -> P5
  # Keep the original fusion structure
  # -------------------------------------------------------
  - [-1, 1, Conv, [512, 3, 2]]            # 20-P5/32
  - [[-1, 10], 1, Concat, [1]]            # 21-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 22-P5/32

  # -------------------------------------------------------
  # Detect: P3/8, P4/16, P5/32
  # Keep the original Detect head
  # -------------------------------------------------------
  - [[16, 19, 22], 1, Detect, [nc]]       # 23
