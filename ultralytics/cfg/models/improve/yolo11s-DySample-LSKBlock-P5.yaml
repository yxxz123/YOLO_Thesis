# Ultralytics YOLO11s
# DySample + LSKBlock-P5
#
# Design:
# 1. Keep YOLO11s backbone structure unchanged.
# 2. Insert LSKBlock after C2PSA at the P5 semantic source.
# 3. Feed the enhanced P5 feature into DySample top-down propagation.
# 4. Reuse the enhanced P5 feature in the final P5 bottom-up fusion.
#
# Goal:
# Improve large-receptive-field semantic/context information before
# it propagates through the DySample top-down feature pyramid.

nc: 1

scale: s

scales:
  s: [0.50, 0.50, 1024]


# ============================================================
# Backbone
# ============================================================

backbone:

  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2

  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2-P2/4

  - [-1, 1, Conv, [256, 3, 2]]                 # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]          # 4-P3/8

  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                 # 6-P4/16

  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]                # 8-P5/32

  - [-1, 1, SPPF, [1024, 5]]                   # 9-P5/32
  - [-1, 2, C2PSA, [1024]]                     # 10-P5/32


# ============================================================
# Head
# ============================================================

head:

  # ==========================================================
  # P5 semantic enhancement
  # ==========================================================

  - [-1, 1, LSKBlock, []]                      # 11-P5/32


  # ----------------------------------------------------------
  # Top-down: enhanced P5 -> P4
  # ----------------------------------------------------------

  - [-1, 1, DySample, []]                      # 12-P4/16

  - [[-1, 6], 1, Concat, [1]]                  # 13-P4/16

  - [-1, 2, C3k2, [512, False]]                # 14-P4/16


  # ----------------------------------------------------------
  # Top-down: P4 -> P3
  # ----------------------------------------------------------

  - [-1, 1, DySample, []]                      # 15-P3/8

  - [[-1, 4], 1, Concat, [1]]                  # 16-P3/8

  - [-1, 2, C3k2, [256, False]]                # 17-P3/8


  # ----------------------------------------------------------
  # Bottom-up PAN: P3 -> P4
  # ----------------------------------------------------------

  - [-1, 1, Conv, [256, 3, 2]]                 # 18-P4/16

  - [[-1, 14], 1, Concat, [1]]                 # 19-P4/16

  - [-1, 2, C3k2, [512, False]]                # 20-P4/16


  # ----------------------------------------------------------
  # Bottom-up PAN: P4 -> P5
  #
  # IMPORTANT:
  # Fuse with enhanced P5 layer 11,
  # not raw C2PSA layer 10.
  # ----------------------------------------------------------

  - [-1, 1, Conv, [512, 3, 2]]                 # 21-P5/32

  - [[-1, 11], 1, Concat, [1]]                 # 22-P5/32

  - [-1, 2, C3k2, [1024, True]]                # 23-P5/32


  # ----------------------------------------------------------
  # Detect
  # ----------------------------------------------------------

  - [[17, 20, 23], 1, Detect, [nc]]            # 24-P3/8,P4/16,P5/32