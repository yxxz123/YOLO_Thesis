# YOLO11s + Local DRFD + DySample
#
# Highway UAV vehicle detection
#
# Design:
# 1. Only replace P2/4 -> P3/8 downsampling Conv with DRFD
# 2. Keep P3/8 -> P4/16 and P4/16 -> P5/32 original Conv downsampling
# 3. Keep the proven DySample neck unchanged
# 4. Keep P3/8, P4/16, P5/32 detection scales unchanged
#
# Purpose:
# Preserve shallow small-object details before P3,
# then reconstruct multi-scale features using DySample.

# Parameters
nc: 1

# Explicitly lock YOLO11s scale
scale: s

scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

# ============================================================
# Backbone
# ============================================================

backbone:
  # P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2

  # P2/4
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4

  - [-1, 1, DRFD, [256]] # 3-P3/8

  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8

  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16

  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32

  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32

# ============================================================
# DySample Neck
# Keep exactly the same as current yolo11s-DySample.yaml
# ============================================================

head:
  # ----------------------------------------------------------
  # P5/32 -> P4/16
  # ----------------------------------------------------------

  - [-1, 1, DySample, []] # 11-P4/16

  - [[-1, 6], 1, Concat, [1]] # 12-P4/16

  - [-1, 2, C3k2, [512, False]] # 13-P4/16

  # ----------------------------------------------------------
  # P4/16 -> P3/8
  # ----------------------------------------------------------

  - [-1, 1, DySample, []] # 14-P3/8

  - [[-1, 4], 1, Concat, [1]] # 15-P3/8

  - [-1, 2, C3k2, [256, False]] # 16-P3/8

  # ----------------------------------------------------------
  # PAN bottom-up
  # Keep original Conv downsampling
  # ----------------------------------------------------------

  - [-1, 1, Conv, [256, 3, 2]] # 17-P4/16

  - [[-1, 13], 1, Concat, [1]] # 18-P4/16

  - [-1, 2, C3k2, [512, False]] # 19-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 20-P5/32

  - [[-1, 10], 1, Concat, [1]] # 21-P5/32

  - [-1, 2, C3k2, [1024, True]] # 22-P5/32

  # ----------------------------------------------------------
  # Detection
  # ----------------------------------------------------------

  - [[16, 19, 22], 1, Detect, [nc]] # 23-P3/8,P4/16,P5/32
