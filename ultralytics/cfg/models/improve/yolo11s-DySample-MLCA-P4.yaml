# Ultralytics YOLO11s
# DySample + MLCA-P4
#
# Purpose:
# - Keep the proven DySample topology unchanged.
# - Retain only the P4 MLCA branch from the previous MLCA-TD experiment.
# - Remove P3 MLCA to avoid suppressing weak small-object responses.
#
# Target:
# Improve mAP50-95/localization quality while recovering Recall and APs.

nc: 1
scale: s

scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]]                 # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]          # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                 # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]                # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]]                   # 9-P5/32
  - [-1, 2, C2PSA, [1024]]                     # 10-P5/32

head:
  # P5 -> P4
  - [-1, 1, DySample, []]                      # 11-P4/16
  - [[-1, 6], 1, Concat, [1]]                  # 12-P4/16
  - [-1, 1, MLCA, []]                          # 13-P4/16
  - [-1, 2, C3k2, [512, False]]                # 14-P4/16

  # P4 -> P3
  - [-1, 1, DySample, []]                      # 15-P3/8
  - [[-1, 4], 1, Concat, [1]]                  # 16-P3/8
  - [-1, 2, C3k2, [256, False]]                # 17-P3/8

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                 # 18-P4/16
  - [[-1, 14], 1, Concat, [1]]                 # 19-P4/16
  - [-1, 2, C3k2, [512, False]]                # 20-P4/16

  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                 # 21-P5/32
  - [[-1, 10], 1, Concat, [1]]                 # 22-P5/32
  - [-1, 2, C3k2, [1024, True]]                # 23-P5/32

  - [[17, 20, 23], 1, Detect, [nc]]            # 24-P3/8,P4/16,P5/32
