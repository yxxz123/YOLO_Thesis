
# YOLO11s + DySample + MSAD
# Highway Vehicle Detection
# MSAD: P2/4 -> P3/8 下采样
# 保留原有 DySample 上采样及检测头

nc: 1

scales:
  s: [0.50, 0.50, 1024]

backbone:
  # 0: P1/2
  - [-1, 1, Conv, [64, 3, 2]]

  # 1: P2/4
  - [-1, 1, Conv, [128, 3, 2]]

  # 2: P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]

  # 3: MSAD 替换原 Conv
  - [-1, 1, MSAD, [256]]

  # 4: P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]

  # 5: P4/16
  - [-1, 1, Conv, [512, 3, 2]]

  # 6: P4/16
  - [-1, 2, C3k2, [512, True]]

  # 7: P5/32
  - [-1, 1, Conv, [1024, 3, 2]]

  # 8: P5/32
  - [-1, 2, C3k2, [1024, True]]

  # 9: SPPF
  - [-1, 1, SPPF, [1024, 5]]

  # 10: C2PSA
  - [-1, 2, C2PSA, [1024]]

head:
  # 11: P5 -> P4
  - [-1, 1, DySample, []]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  # 14: P4 -> P3
  - [-1, 1, DySample, []]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  # 17: P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  # 20: P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  # Detect: P3/8, P4/16, P5/32
  - [[16, 19, 22], 1, Detect, [nc]]
