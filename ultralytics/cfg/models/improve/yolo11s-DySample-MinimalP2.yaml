# Ultralytics YOLO11s
# DySample + Minimal P2 Detect
#
# Purpose:
# - Keep the complete proven DySample P3/P4/P5 neck unchanged.
# - Add only one lightweight P2/4 detection branch.
# - Do NOT feed P2 back into P3/P4/P5, so the original DySample path is preserved.
#
# Target:
# Improve tiny/small vehicle detection, APs and Recall by detecting at stride 4.

nc: 1
scale: s

scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]]                 # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]          # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                 # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]                # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]]                   # 9-P5/32
  - [-1, 2, C2PSA, [1024]]                     # 10-P5/32

head:
  # Original DySample P5 -> P4
  - [-1, 1, DySample, []]                      # 11-P4/16
  - [[-1, 6], 1, Concat, [1]]                  # 12-P4/16
  - [-1, 2, C3k2, [512, False]]                # 13-P4/16

  # Original DySample P4 -> P3
  - [-1, 1, DySample, []]                      # 14-P3/8
  - [[-1, 4], 1, Concat, [1]]                  # 15-P3/8
  - [-1, 2, C3k2, [256, False]]                # 16-P3/8

  # Original bottom-up P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                 # 17-P4/16
  - [[-1, 13], 1, Concat, [1]]                 # 18-P4/16
  - [-1, 2, C3k2, [512, False]]                # 19-P4/16

  # Original bottom-up P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                 # 20-P5/32
  - [[-1, 10], 1, Concat, [1]]                 # 21-P5/32
  - [-1, 2, C3k2, [1024, True]]                # 22-P5/32

  # ----------------------------------------------------------
  # New minimal P2 branch only
  # ----------------------------------------------------------

  # Reduce P3 channels before high-resolution upsampling
  - [16, 1, Conv, [128, 1, 1]]                 # 23-P3/8 lightweight lateral

  # P3 -> P2 with DySample
  - [-1, 1, DySample, []]                      # 24-P2/4

  # Lightweight backbone P2 lateral
  - [2, 1, Conv, [128, 1, 1]]                  # 25-P2/4 lateral

  # Fuse only for the P2 detection branch
  - [[24, 25], 1, Concat, [1]]                 # 26-P2/4

  - [-1, 1, C3k2, [128, False, 0.25]]          # 27-P2/4

  # Four-scale detection: P2, original P3, original P4, original P5
  - [[27, 16, 19, 22], 1, Detect, [nc]]        # 28-P2/4,P3/8,P4/16,P5/32
