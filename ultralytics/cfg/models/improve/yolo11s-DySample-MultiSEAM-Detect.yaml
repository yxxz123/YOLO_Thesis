# Ultralytics YOLO11s
# DySample + MultiSEAM-Detect
#
# Design:
# 1. Keep the complete DySample neck unchanged.
# 2. Apply MultiSEAM independently to final P3/P4/P5 features.
# 3. Feed enhanced multi-scale features into Detect.
#
# Goal:
# Improve local and multi-scale feature representation immediately
# before the detection head, especially for dense/partially occluded vehicles.

nc: 1

scale: s

scales:
  s: [0.50, 0.50, 1024]


# ============================================================
# Backbone
# ============================================================

backbone:

  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2

  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2-P2/4

  - [-1, 1, Conv, [256, 3, 2]]                 # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]          # 4-P3/8

  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                 # 6-P4/16

  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]                # 8-P5/32

  - [-1, 1, SPPF, [1024, 5]]                   # 9-P5/32
  - [-1, 2, C2PSA, [1024]]                     # 10-P5/32


# ============================================================
# DySample Neck
# Exactly the same as proven YOLO11s-DySample
# ============================================================

head:

  # P5 -> P4
  - [-1, 1, DySample, []]                      # 11-P4/16
  - [[-1, 6], 1, Concat, [1]]                  # 12-P4/16
  - [-1, 2, C3k2, [512, False]]                # 13-P4/16


  # P4 -> P3
  - [-1, 1, DySample, []]                      # 14-P3/8
  - [[-1, 4], 1, Concat, [1]]                  # 15-P3/8
  - [-1, 2, C3k2, [256, False]]                # 16-P3/8


  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                 # 17-P4/16
  - [[-1, 13], 1, Concat, [1]]                 # 18-P4/16
  - [-1, 2, C3k2, [512, False]]                # 19-P4/16


  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                 # 20-P5/32
  - [[-1, 10], 1, Concat, [1]]                 # 21-P5/32
  - [-1, 2, C3k2, [1024, True]]                # 22-P5/32


  # ==========================================================
  # MultiSEAM detection-scale enhancement
  # ==========================================================

  - [16, 1, MultiSEAM, []]                     # 23-P3/8

  - [19, 1, MultiSEAM, []]                     # 24-P4/16

  - [22, 1, MultiSEAM, []]                     # 25-P5/32


  # ==========================================================
  # Detect
  # ==========================================================

  - [[23, 24, 25], 1, Detect, [nc]]            # 26-P3/8,P4/16,P5/32