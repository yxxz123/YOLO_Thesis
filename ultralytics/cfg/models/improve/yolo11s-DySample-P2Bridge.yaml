# YOLO11s + DySample + Lightweight P2-Bridge
#
# Design purpose:
# 1. Keep the original YOLO11s backbone unchanged.
# 2. Keep the proven DySample P5->P4 and P4->P3 upsampling unchanged.
# 3. Add ONE lightweight P2/4 -> P3/8 bridge.
# 4. Fuse P2 shallow detail with:
#       - DySample reconstructed P3 feature
#       - Original backbone P3 feature
# 5. Keep only P3/P4/P5 detection heads.
# 6. Do NOT add a P2 detection head.
#
# This is intended as a single-variable experiment for small vehicle detection.

# ============================================================
# Parameters
# ============================================================

nc: 1

# Explicitly lock YOLO11s
scale: s

scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]


# ============================================================
# Backbone
# EXACTLY the same as current YOLO11s / DySample backbone
# ============================================================

backbone:

  # P1/2
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2

  # P2/4
  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]          # 2-P2/4

  # P3/8
  - [-1, 1, Conv, [256, 3, 2]]                 # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]          # 4-P3/8

  # P4/16
  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                 # 6-P4/16

  # P5/32
  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]                # 8-P5/32

  - [-1, 1, SPPF, [1024, 5]]                   # 9-P5/32
  - [-1, 2, C2PSA, [1024]]                     # 10-P5/32


# ============================================================
# DySample + Lightweight P2-Bridge Neck
# ============================================================

head:

  # ----------------------------------------------------------
  # Stage 1:
  # P5/32 -> P4/16
  #
  # Same as proven DySample model
  # ----------------------------------------------------------

  - [-1, 1, DySample, []]                      # 11-P4/16

  - [[-1, 6], 1, Concat, [1]]                  # 12-P4/16

  - [-1, 2, C3k2, [512, False]]                # 13-P4/16


  # ----------------------------------------------------------
  # Stage 2:
  # P4/16 -> P3/8
  #
  # Same DySample operation as current best model
  # ----------------------------------------------------------

  - [-1, 1, DySample, []]                      # 14-P3/8


  # ----------------------------------------------------------
  # NEW: Lightweight P2-Bridge
  #
  # Backbone layer 2:
  # P2/4 -> lightweight stride-2 Conv -> P3/8
  #
  # Nominal output = 64
  # Under scale=s (width=0.50), actual output is lightweight.
  #
  # Important:
  # This is an auxiliary branch.
  # It does NOT replace the backbone P2->P3 main path.
  # ----------------------------------------------------------

  - [2, 1, Conv, [64, 3, 2]]                   # 15-P2Bridge -> P3/8


  # ----------------------------------------------------------
  # P3 fusion
  #
  # Inputs:
  # 14 = DySample reconstructed P3
  # 4  = Original backbone P3
  # 15 = P2 shallow-detail bridge
  #
  # This is the ONLY structural difference compared with
  # the original DySample model.
  # ----------------------------------------------------------

  - [[14, 4, 15], 1, Concat, [1]]              # 16-P3/8

  - [-1, 2, C3k2, [256, False]]                # 17-P3/8


  # ----------------------------------------------------------
  # Original PAN bottom-up:
  # P3/8 -> P4/16
  # ----------------------------------------------------------

  - [-1, 1, Conv, [256, 3, 2]]                 # 18-P4/16

  - [[-1, 13], 1, Concat, [1]]                 # 19-P4/16

  - [-1, 2, C3k2, [512, False]]                # 20-P4/16


  # ----------------------------------------------------------
  # P4/16 -> P5/32
  # ----------------------------------------------------------

  - [-1, 1, Conv, [512, 3, 2]]                 # 21-P5/32

  - [[-1, 10], 1, Concat, [1]]                 # 22-P5/32

  - [-1, 2, C3k2, [1024, True]]                # 23-P5/32


  # ----------------------------------------------------------
  # Detection
  #
  # Still only P3 / P4 / P5
  # NO P2 Detect head
  # ----------------------------------------------------------

  - [[17, 20, 23], 1, Detect, [nc]]            # 24-P3/8,P4/16,P5/32