  - [[-1, 13], 1, Concat, [1]]              # 18
  - [-1, 2, C3k2, [512, False]]             # 19-P4/16


  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]              # 20
  - [[-1, 10], 1, Concat, [1]]              # 21
  - [-1, 2, C3k2, [1024, True]]             # 22-P5/32


  # RPL Detection Head
  - [[16, 19, 22], 1, Detect_RPL, [nc]]      # 23