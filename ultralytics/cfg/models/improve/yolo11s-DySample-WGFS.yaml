# YOLO11s + WGFS Stem + DySample
# WGFS replaces the original two-layer P1/P2 stem with one 4x downsampling stem.
# DySample replaces both nearest-neighbor upsampling operations in the original neck.
# Detection outputs remain P3/8, P4/16, and P5/32.

nc: 1
scale: s
scales:
  s: [0.50, 0.50, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, WGFS, [128]]                 # 0-P2/4, 4x downsampling
  - [-1, 2, C3k2, [256, False, 0.25]]   # 1-P2/4
  - [-1, 1, Conv, [256, 3, 2]]          # 2-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 3-P3/8
  - [-1, 1, Conv, [512, 3, 2]]          # 4-P4/16
  - [-1, 2, C3k2, [512, True]]          # 5-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]         # 6-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 7-P5/32
  - [-1, 1, SPPF, [1024, 5]]            # 8-P5/32
  - [-1, 2, C2PSA, [1024]]              # 9-P5/32

head:
  - [-1, 1, DySample, []]               # 10-P4/16, P5 -> P4
  - [[-1, 5], 1, Concat, [1]]           # 11-P4/16
  - [-1, 2, C3k2, [512, False]]         # 12-P4/16

  - [-1, 1, DySample, []]               # 13-P3/8, P4 -> P3
  - [[-1, 3], 1, Concat, [1]]           # 14-P3/8
  - [-1, 2, C3k2, [256, False]]         # 15-P3/8

  - [-1, 1, Conv, [256, 3, 2]]          # 16-P4/16
  - [[-1, 12], 1, Concat, [1]]          # 17-P4/16
  - [-1, 2, C3k2, [512, False]]         # 18-P4/16

  - [-1, 1, Conv, [512, 3, 2]]          # 19-P5/32
  - [[-1, 9], 1, Concat, [1]]           # 20-P5/32
  - [-1, 2, C3k2, [1024, True]]         # 21-P5/32

  - [[15, 18, 21], 1, Detect, [nc]]     # 22-Detect(P3/8, P4/16, P5/32)
